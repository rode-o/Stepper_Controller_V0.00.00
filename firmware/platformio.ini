; PlatformIO Project Configuration File
; See https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_rp2040]
platform          = https://github.com/Seeed-Studio/platform-seeedboards.git
board             = seeed-xiao-rp2040
framework         = arduino
upload_protocol   = picotool
monitor_speed     = 115200
monitor_filters   = time, colorize, send_on_enter
monitor_eol       = CRLF

; ───────────────────────────────────────────────────────────────
; Build options
;   • disable LTO so setup()/loop() aren’t dropped by the linker
;   • override the on-board LED pin without re-definition warnings
; ───────────────────────────────────────────────────────────────
build_unflags     = -flto
build_flags       =
    -ULED_BUILTIN          ; undefine the core’s default
    -DLED_BUILTIN=25       ; XIAO’s on-board LED

; ───────────────────────────────────────────────────────────────
; Library dependencies
; ───────────────────────────────────────────────────────────────
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.2
    adafruit/Adafruit SSD1306@^2.5.15
    https://github.com/adafruit/Adafruit_SH110X.git
    https://github.com/br3ttb/Arduino-PID-Library.git
    https://github.com/Sensirion/arduino-i2c-sf06-lf.git
    adafruit/Adafruit NeoPixel@^1.15.1
